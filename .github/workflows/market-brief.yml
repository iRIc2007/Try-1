# ─────────────────────────────────────────────────────────────────────────────
# Daily Market Brief — GitHub Actions Workflow
# Runs every morning at ~7:00 AM Milan time, year-round.
#
# Italy uses CET (UTC+1) in winter and CEST (UTC+2) in summer:
#   CET  (Nov–Mar): 7 AM Milan = 6 AM UTC  →  cron "0 6 * * *"
#   CEST (Mar–Oct): 7 AM Milan = 5 AM UTC  →  cron "0 5 * * *"
#
# Both crons fire daily. GitHub Actions crons can be delayed 10-60+ min,
# so the timezone gate accepts Milan hours 06-08 to avoid missed sends.
# A date-keyed cache prevents double-sends when both crons pass the gate.
# ─────────────────────────────────────────────────────────────────────────────

name: Daily Market Brief

on:
  schedule:
    - cron: "0 5 * * *"    # 7:00 AM Milan during CEST (summer)
    - cron: "0 6 * * *"    # 7:00 AM Milan during CET  (winter)

  # Manual trigger always runs (skips timezone gate + dedup)
  workflow_dispatch:

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 0. Timezone gate ──
      #    Schedule: only proceed if Milan hour is 06, 07, or 08
      #    Manual dispatch: always proceed
      - name: Check Milan time
        id: tz_check
        run: |
          MILAN_HOUR=$(TZ='Europe/Rome' date +%H)
          MILAN_TIME=$(TZ='Europe/Rome' date '+%H:%M %Z')
          echo "milan_date=$(TZ='Europe/Rome' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Milan time: $MILAN_TIME"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Manual dispatch — proceeding"
          elif [ "$MILAN_HOUR" = "06" ] || [ "$MILAN_HOUR" = "07" ] || [ "$MILAN_HOUR" = "08" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Milan time is $MILAN_TIME — within send window, proceeding"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  Skipping: Milan time is $MILAN_TIME, outside 06-08 window"
          fi

      # ── 1. Check out the repo ──
      - name: Checkout repository
        if: steps.tz_check.outputs.skip != 'true'
        uses: actions/checkout@v4

      # ── 1b. Dedup: prevent double-send when both crons pass the gate ──
      #    Uses a date-keyed cache. First cron creates it; second finds it and skips.
      #    Manual dispatch bypasses this entirely.
      - name: Check if already sent today
        if: steps.tz_check.outputs.skip != 'true' && github.event_name == 'schedule'
        id: dedup
        uses: actions/cache@v4
        with:
          path: .brief-sent-marker
          key: brief-sent-${{ steps.tz_check.outputs.milan_date }}

      - name: Dedup gate
        if: steps.tz_check.outputs.skip != 'true' && github.event_name == 'schedule'
        id: dedup_gate
        run: |
          if [ -f .brief-sent-marker ]; then
            echo "⏭️  Brief already sent today — skipping duplicate cron"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "sent" > .brief-sent-marker
            echo "✅ First cron today — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Helper: should we proceed? ──
      #    proceed = tz_check passed AND (manual OR dedup passed)
      - name: Final gate check
        id: gate
        if: steps.tz_check.outputs.skip != 'true'
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.dedup_gate.outputs.skip }}" == "true" ]]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Blocked by dedup"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Set up Python 3.11 ──
      - name: Set up Python 3.11
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ──
      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      # ── 4. Run market_brief.py with live data ──
      - name: Generate market brief
        if: steps.gate.outputs.go == 'true'
        id: generate
        run: |
          python market_brief.py
          # Find today's report file
          REPORT=$(ls -t reports/*.html | head -1)
          echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
          echo "✅ Report generated: $REPORT"

      # ── 5. Email the HTML report ──
      - name: Email report
        if: steps.gate.outputs.go == 'true' && success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "📊 Daily Market Brief"
          to: riccardococchi46@gmail.com
          from: ${{ secrets.GMAIL_USERNAME }}
          html_body: file://${{ steps.generate.outputs.report_path }}
          content_type: text/html

      # ── 6. Failure alert ──
      - name: Send failure alert
        if: steps.gate.outputs.go == 'true' && failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ Market Brief FAILED"
          to: riccardococchi46@gmail.com
          from: ${{ secrets.GMAIL_USERNAME }}
          html_body: |
            <h2>⚠️ Your Daily Market Brief failed to generate</h2>
            <p><b>Time:</b> ${{ github.event.head_commit.timestamp || 'Manual run' }}</p>
            <p><b>Run:</b> <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
            View logs on GitHub</a></p>
            <p>Check the workflow logs for details on what went wrong.</p>
          content_type: text/html
